[workspace]
resolver = "2"
members = [
    "crates/gateway-api",
    "crates/gateway-core",
    "crates/gateway-providers",
    "crates/gateway-cache",
    "crates/gateway-quota",
    "crates/gateway-auth",
    "crates/gateway-db",
    "crates/gateway-observability",
    "crates/gateway-solo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ai-gateway/ai-gateway"
rust-version = "1.78"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Web framework & HTTP
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "limit", "fs", "set-header"] }
tower-cookies = "0.10"
axum = { version = "0.7", features = ["macros"] }
hyper = { version = "1.3", features = ["full"] }
http = "1.1"
http-body = "1.0"
http-body-util = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "cookies"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "any", "migrate", "uuid", "chrono", "rust_decimal"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Cache & Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
moka = { version = "0.12", features = ["future"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Auth
jsonwebtoken = "9.3"
argon2 = "0.5"
password-hash = "0.5"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
aes-gcm = "0.10"

# Encoding
bs58 = "0.5"
crc32c = "0.6"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Config
envy = "0.4"
figment = { version = "0.10", features = ["env", "toml", "json"] }

# Utilities
async-trait = "0.1"
once_cell = "1.19"
rand = "0.8"
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
ratatui = "0.29"
crossterm = "0.28"
regex = "1.10"

# OpenAPI (future)
utoipa = { version = "4.2", features = ["axum_extras"] }

# Encoding utilities
hex = "0.4"
blake3 = "1.5"

# Decimal arithmetic
rust_decimal = { version = "1.35", features = ["db-tokio-postgres"] }

# Testing
tokio-test = "0.4"
mockall = "0.12"
wiremock = "0.6"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }
rsa = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
