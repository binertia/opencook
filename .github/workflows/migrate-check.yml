name: Migration Check

on:
  push:
    branches: [main, master]
    paths:
      - 'migrations/**'
      - '.github/workflows/migrate-check.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'migrations/**'
      - '.github/workflows/migrate-check.yml'

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  migrate-fresh:
    name: Migrate Fresh Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres

      - name: Run migrations on fresh database
        run: sqlx migrate run --database-url postgres://gateway:gateway@localhost:5432/gateway

      - name: Verify migration list
        run: sqlx migrate info --database-url postgres://gateway:gateway@localhost:5432/gateway

  migrate-existing:
    name: Migrate Existing Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres

      - name: Check out base branch migrations
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}
          git checkout origin/${{ github.base_ref || 'main' }} -- migrations/ || true

      - name: Run base branch migrations
        run: sqlx migrate run --database-url postgres://gateway:gateway@localhost:5432/gateway

      - name: Restore PR migrations
        run: git checkout HEAD -- migrations/

      - name: Run new migrations on existing database
        run: sqlx migrate run --database-url postgres://gateway:gateway@localhost:5432/gateway

      - name: Test rollback of latest migration
        run: |
          LATEST=$(sqlx migrate info --database-url postgres://gateway:gateway@localhost:5432/gateway | grep 'applied' | tail -1 | awk '{print $1}')
          echo "Testing rollback of migration: $LATEST"
          sqlx migrate revert --database-url postgres://gateway:gateway@localhost:5432/gateway
          sqlx migrate run --database-url postgres://gateway:gateway@localhost:5432/gateway

  migration-lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unsafe migration patterns
        run: |
          ERRORS=0

          echo "Checking for DROP COLUMN in .up.sql files..."
          if grep -riE 'DROP\s+COLUMN' migrations/*.up.sql; then
            echo "ERROR: DROP COLUMN detected in an .up.sql migration. Use a 3-release cycle."
            ERRORS=$((ERRORS + 1))
          fi

          echo "Checking for DROP TABLE in .up.sql files..."
          if grep -riE 'DROP\s+TABLE' migrations/*.up.sql; then
            echo "ERROR: DROP TABLE detected in an .up.sql migration."
            ERRORS=$((ERRORS + 1))
          fi

          echo "Checking for IF NOT EXISTS on CREATE statements..."
          for f in migrations/*.up.sql; do
            if grep -iE 'CREATE\s+(TABLE|INDEX|EXTENSION)' "$f" | grep -vqi 'IF NOT EXISTS'; then
              echo "WARNING: $f contains CREATE without IF NOT EXISTS"
            fi
          done

          echo "Checking that every .up.sql has a matching .down.sql..."
          for up in migrations/*.up.sql; do
            down="${up%.up.sql}.down.sql"
            if [[ ! -f "$down" ]]; then
              echo "ERROR: Missing rollback script: $down"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [[ $ERRORS -gt 0 ]]; then
            echo "Migration lint found $ERRORS error(s)."
            exit 1
          fi

          echo "Migration lint passed."
