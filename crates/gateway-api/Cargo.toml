[package]
name = "gateway-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "gateway-api"
path = "src/main.rs"

[dependencies]
gateway-core = { path = "../gateway-core" }
gateway-auth = { path = "../gateway-auth" }
gateway-db = { path = "../gateway-db" }
gateway-observability = { path = "../gateway-observability" }
gateway-providers = { path = "../gateway-providers" }
gateway-cache = { path = "../gateway-cache" }
gateway-quota = { path = "../gateway-quota" }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower-cookies = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
redis = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
reqwest = { workspace = true }
validator = { workspace = true }
regex = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
rust_decimal = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

[dev-dependencies]
wiremock = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tempfile = "3"
