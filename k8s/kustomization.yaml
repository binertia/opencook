apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gateway

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml
  - poddisruptionbudget.yaml

images:
  - name: gateway
    newTag: latest

commonLabels:
  app.kubernetes.io/name: gateway
  app.kubernetes.io/managed-by: kustomize
