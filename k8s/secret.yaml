apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: gateway
  labels:
    app.kubernetes.io/name: gateway
type: Opaque
stringData:
  # --- REPLACE THESE PLACEHOLDERS BEFORE DEPLOYING ---
  # Never commit real secrets to version control.
  # Use a secrets manager (Vault, Sealed Secrets, External Secrets Operator)
  # or inject via CI/CD.
  GATEWAY_MASTER_KEY: "REPLACE_WITH_64_CHAR_HEX"
  GATEWAY_JWT_PRIVATE_KEY: |
    REPLACE_WITH_JWT_PRIVATE_KEY_PEM
  GATEWAY_JWT_PUBLIC_KEY: |
    REPLACE_WITH_JWT_PUBLIC_KEY_PEM
  DATABASE_URL: "postgres://gateway:REPLACE@postgres:5432/gateway"
  REDIS_URL: "redis://redis:6379"
  GATEWAY_ALLOWED_ORIGINS: "https://gateway.example.com"
