version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gateway-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_dev_password
      POSTGRES_DB: gateway_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2-alpine
    container_name: gateway-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev
    container_name: gateway-backend-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gateway:gateway_dev_password@postgres:5432/gateway_dev
      REDIS_URL: redis://redis:6379
      RUST_LOG: debug
      RUST_BACKTRACE: 1
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: ["/bin/sh", "-c", "cargo watch -x check -x 'run --bin gateway-api'"]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.dev
    container_name: gateway-frontend-dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - node_modules_cache:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_dev_data:
  redis_dev_data:
  cargo_cache:
  target_cache:
  node_modules_cache:
